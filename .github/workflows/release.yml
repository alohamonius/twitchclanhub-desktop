name: Release

# A v* tag builds the standalone installers (Windows NSIS, macOS universal DMG) and publishes them
# as one GitHub Release. The website links to .../releases/latest/download/<fixed name>, so the
# names must stay: twitchclanhub-setup.exe, twitchclanhub-mac.dmg. The Windows build also ships
# latest.yml and the .blockmap: electron-updater reads them from the latest release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            file: |
              dist/twitchclanhub-setup.exe
              dist/twitchclanhub-setup.exe.blockmap
              dist/latest.yml
            artifact: windows
          - os: macos-latest
            script: dist:mac
            file: dist/twitchclanhub-mac.dmg
            artifact: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: node --test "test/*.test.js"
      - run: npm run ${{ matrix.script }}
      - name: The updater's manifest must exist (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length
          if (-not (Test-Path dist/latest.yml)) { throw 'dist/latest.yml is missing: auto-update would not work' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
